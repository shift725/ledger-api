# 由 frontend/Dockerfile 複製到 /etc/nginx/conf.d/default.conf，取代 image 內建的預設站台。
# 一個 server 同時做兩件事：服 Vue 的建置產物，並把 /api 反代給 Django——
# 瀏覽器眼中前後端同源，CORS 這整類問題自始不存在（不是「設定好」，是「被設計掉」）。

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip           on;
    gzip_vary      on;
    gzip_min_length 1024;
    gzip_types     text/css application/javascript application/json image/svg+xml application/manifest+json;

    # 反代目標寫成變數＋指定 Docker 內建 DNS（127.0.0.11），讓 nginx 每次請求才解析 web 的 IP。
    # 若照慣例寫死主機名，nginx 只在啟動時解析一次並永久沿用——web 容器一被重建就換 IP，
    # 這裡會持續打到已不存在的舊位址，得手動重啟 frontend 才恢復。
    # 代價：proxy_pass 一旦帶變數，nginx 就不會自動接上原始路徑，必須明寫 $request_uri。
    resolver 127.0.0.11 valid=10s;
    set $backend http://web:8000;

    location /api/ {
        proxy_pass         $backend$request_uri;
        proxy_http_version 1.1;
        # 用 $http_host 而非 $host：前者保留 port，DRF 分頁回應裡的絕對連結（next／previous）
        # 才會指回瀏覽器實際用的位址（FRONTEND_PORT 換成非 80 時尤其明顯）。
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # vite 產的資產檔名帶內容雜湊（檔名變＝內容變），可以放心讓瀏覽器永久快取。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA：先找真檔，找不到就交給 index.html 讓 vue-router 接手（深連結重整不會 404）。
    location / {
        try_files $uri $uri/ /index.html;
        # index.html／sw.js／manifest 一律每次回源驗證（沒變就 304，很便宜），否則新版部署後
        # 使用者會被瀏覽器快取住的舊殼卡著——連 autoUpdate 的 service worker 都換不掉。
        add_header Cache-Control "no-cache";
    }
}
