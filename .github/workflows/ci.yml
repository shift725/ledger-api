name: CI

# PR（任何分支發的 PR）+ push 到 main 時觸發。
# 只在 push main 跑，避免 feature 分支「push 事件 + PR 事件」重複跑兩次。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # 順帶起一顆臨時 Postgres 給測試連（跑完即丟）。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        # 等 DB ready 再開始跑測試，否則第一個連線會撲空。
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # settings.py 沒給 SECRET_KEY / DATABASE_URL 預設值 → 不注入就會 import 崩。
    # 這兩個是 CI 專用拋棄值（測試 DB 隨 job 消滅），非真機密，可明寫。
    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DATABASE_URL: postgres://ledger:ci-postgres-password@localhost:5432/ledger

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                       # 快取 pip 下載，第二次跑更快
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安裝依賴（runtime + 開發工具）
        run: pip install -r requirements-dev.txt

      - name: Lint（ruff check）
        run: ruff check .

      - name: 格式檢查（ruff format --check）
        run: ruff format --check .

      - name: 測試 + 蒐集覆蓋率
        run: coverage run -m pytest

      - name: 覆蓋率門檻（pyproject fail_under=75，低於即 fail）
        run: coverage report

  # 前端 job：與 test 並行，全部在 frontend/ 下跑。
  # 每支 PR 前後端都跑（不做 path filter——required check 被 skip 會卡 merge）。
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc          # 與本機 .nvmrc 同一版
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安裝依賴（npm ci，嚴格照 lockfile）
        run: npm ci

      - name: Lint（oxlint + eslint）
        run: npm run lint

      - name: 格式檢查（prettier --check）
        run: npm run format:check

      - name: 型別檢查（vue-tsc）
        run: npm run type-check

      - name: 單元測試（vitest run）
        run: npm run test:unit

      - name: 建置（vite build）
        run: npm run build

      # PWA 產物斷言：manifest＋service worker 存在、index.html 有掛 manifest。
      # （Lighthouse 12 移除了 PWA category，installability 由此斷言＋實機驗承接）
      - name: PWA 產物斷言
        run: |
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          grep -q 'rel="manifest"' dist/index.html

      # a11y 守門：起 preview 掃 login/register，assert 見 lighthouserc.cjs（滿分門檻）。
      - name: Lighthouse accessibility 守門
        run: npx lhci autorun

      # 契約看守：重生型別後 git diff 必須乾淨——openapi.yaml 改了卻沒重生型別即 fail。
      - name: 契約型別未漂移
        run: |
          npm run typegen
          git diff --exit-code src/api/schema.d.ts
