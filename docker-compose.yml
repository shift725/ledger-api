# web／worker／beat 三個進程連同一組後端，值必須一致 → 頂層定義一次、各 service 引用，
# 改一處三處同步（防漏改漂移）。x- 前綴是 compose extension field，不會被當成 service。
x-app-env: &app-env
  # 由 compose 從 POSTGRES_* / DB_* 變數組合，避免使用者手動維護兩處
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
  # 服務名固定、無機密 → 直接在 compose 組裝（同 DATABASE_URL 作法）；.env 不必維護。
  # REDIS_URL（db 0）給 cache／throttle；CELERY_BROKER_URL（db 1）給任務佇列，兩者隔離。
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # 不對外開 port（只服務容器網路內的 web/worker）、不掛 volume（快取資料可拋、
    # 當 broker 的任務佇列亦可重建；要持久化再掛 volume）。ping 回 PONG 即 exit 0。
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8000}:8000"
    healthcheck:
      # runtime image 無 curl/wget → 用 python urllib 打探針；
      # urlopen 對非 2xx 拋例外 → exit code 非 0 = unhealthy
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 蓋過 entrypoint 的 wait-for-db → migrate → collectstatic 暖機時間
      start_period: 40s
    restart: unless-stopped

  # worker：執行任務；beat：排程器，到點把任務投進 broker（Redis db 1）。
  # 兩者同 image、只換 command；depends_on web healthy → web entrypoint 先 migrate 完，
  # worker/beat 再過同一 entrypoint 時 migrate/collectstatic 皆 no-op（不與 web 競爭）。
  worker:
    build: .
    env_file: .env
    environment: *app-env
    command: celery -A config worker -l info
    depends_on: &celery-deps
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: .
    env_file: .env
    environment: *app-env
    command: celery -A config beat -l info
    depends_on: *celery-deps
    restart: unless-stopped

  # nginx 服 Vue 的建置產物，並把 /api 反代給 web——瀏覽器只需要這一個 port，
  # 前後端同源，CORS 這整類問題自始不存在。image 內只有 nginx＋靜態檔（見 frontend/Dockerfile）。
  frontend:
    build: ./frontend
    depends_on:
      # 等 web 健康再起：nginx 啟動當下反代目標就已經活著，不會有開站頭幾秒的 502。
      web:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      # nginx alpine 無 curl，用 busybox 內建的 wget（-q -O- 丟棄輸出，非 2xx 即 exit 非 0）。
      # 位址寫 127.0.0.1 不寫 localhost：容器的 /etc/hosts 讓 localhost 同時指向 ::1 與
      # 127.0.0.1，wget 會先試 IPv6 而 nginx 只聽 IPv4（listen 80）→ 檢查必敗。
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ------------------------------------------------------------
  # TLS profile — only started with `docker compose --profile tls up`
  # ------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    profiles: [tls]
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # NGINX_ENVSUBST_FILTER limits envsubst to just DOMAIN_NAME so
      # that nginx's own $host / $remote_addr etc. survive the templates.
      DOMAIN_NAME: ${DOMAIN_NAME}
      NGINX_ENVSUBST_FILTER: DOMAIN_NAME
    volumes:
      - ./docker/nginx:/etc/nginx/templates:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-etc:/etc/letsencrypt:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    profiles: [tls]
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-etc:/etc/letsencrypt
    # Run certbot renew every 12h; `wait $${!}` lets SIGTERM interrupt the sleep
    # so docker compose stop is responsive. `$$` escapes compose interpolation.
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"]
    restart: unless-stopped

volumes:
  pgdata: {}
  certbot-www: {}
  certbot-etc: {}
