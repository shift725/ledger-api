components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        type:
          $ref: '#/components/schemas/AccountTypeEnum'
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        is_default:
          type: boolean
      required:
      - balance
      - id
      - name
      - type
    AccountTypeEnum:
      enum:
      - cash
      - bank
      - credit_card
      - e_wallet
      type: string
      description: |-
        * `cash` - 現金
        * `bank` - 銀行
        * `credit_card` - 信用卡
        * `e_wallet` - 電子錢包
    BalanceHistoryAccount:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
        account_name:
          type: string
        months:
          type: array
          items:
            $ref: '#/components/schemas/BalanceHistoryMonth'
      required:
      - account_id
      - account_name
      - months
    BalanceHistoryMonth:
      type: object
      properties:
        month:
          type: string
          description: YYYY-MM
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - balance
      - month
    BalanceOverview:
      type: object
      properties:
        total_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/BalanceOverviewAccount'
      required:
      - accounts
      - total_balance
    BalanceOverviewAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/AccountTypeEnum'
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - balance
      - id
      - name
      - type
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 255
      required:
      - id
      - name
    CategoryBreakdown:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryBreakdownItem'
      required:
      - categories
      - month
      - year
    CategoryBreakdownItem:
      type: object
      properties:
        category_id:
          type: string
          format: uuid
          nullable: true
        category_name:
          type: string
          nullable: true
        income:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        expense:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - category_id
      - category_name
      - expense
      - income
    CustomTokenObtainPair:
      type: object
      description: |-
        自訂 Token 序列化器
        在 JWT payload 中加入額外的使用者資訊
      properties:
        email:
