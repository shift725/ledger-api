# pre-commit hooks —— commit 前自動跑 lint/format 與通用檢查。
# Ruff 規則沿用 pyproject.toml（單一真實來源），此處不重複定義。
# 版本同步鐵則：ruff-pre-commit 的 rev 必須等於 requirements-dev.txt 的 ruff 釘版。
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16            # = requirements-dev.txt 的 ruff==0.15.16
    hooks:
      - id: ruff-check       # linter（官方新版 hook id）
        args: [--fix]        # 僅套用 safe fixes
      - id: ruff-format      # 格式化（讀 pyproject 的 single-quote）
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]   # 保留 Markdown 行尾雙空格硬換行
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
  # 前端 lint/format：官方 eslint/prettier pre-commit mirror 已 archived，
  # 改用 local hooks 直接跑 frontend 自己的工具（單一真實來源＝package.json，
  # 免在此重複釘版與外掛清單）。scoped ^frontend/，與後端 ruff 對稱、互不干擾。
  - repo: local
    hooks:
      - id: frontend-eslint
        name: eslint（frontend）
        language: system
        entry: npm --prefix frontend run lint:fix
        files: ^frontend/
        pass_filenames: false
      - id: frontend-prettier
        name: prettier（frontend）
        language: system
        entry: npm --prefix frontend run format
        files: ^frontend/
        pass_filenames: false
